; PlatformIO project configuration for the Smart Trolley navigation system.
;
; Environments
;   native                  - host build of the navigation core + unit tests (no hardware)
;   esp32-s3-devkitc-1      - ESP32-S3 firmware (Arduino framework)
;   esp32-s3-devkitc-1-mock - same firmware with the Serial/mock position provider forced on
;
; The portable navigation core lives in navigation_core/ and is consumed as a
; PlatformIO library (navigation_core/library.json) by both the firmware and the
; native test environment, so the simulator and the ESP32 run identical code.
;
; See docs/esp32_firmware.md for wiring and docs/testing.md for the test commands.

[platformio]
src_dir = firmware/src
include_dir = firmware/include
test_dir = tests
default_envs = esp32-s3-devkitc-1

[common_flags]
; The navigation core is compiled directly into every environment (see
; core_sources below) instead of being resolved as a PlatformIO library: this
; keeps one explicit list of core translation units for firmware and tests.
;
; -Wpedantic is intentionally NOT here: the ESP32 Arduino framework headers
; (tinyusb) use flexible array members and anonymous structs, which -Wpedantic
; rejects.  It is enabled for the native build, where only our own code is
; compiled.
build_flags =
    -Wall
    -Wextra
    -I navigation_core/include

[core_sources]
; Paths are relative to src_dir (firmware/src).  The native test environment's
; src_dir is the tests folder, so the same relative depth (two levels up) works
; for both environments.
build_src_filter =
    +<../../navigation_core/src/*.cpp>

; ---------------------------------------------------------------------------
; Native (host) environment: navigation core + Unity unit tests
; ---------------------------------------------------------------------------
[env:native]
platform = native
build_src_filter = ${core_sources.build_src_filter}
test_build_src = yes
build_flags =
    ${common_flags.build_flags}
    -Wpedantic
    -std=c++17
    -O1
    -g
    -DNAV_NATIVE_BUILD=1
    -DNAV_LOG_LEVEL=3
lib_deps =
    throwtheswitch/Unity@^2.6.1

; ---------------------------------------------------------------------------
; ESP32-S3 firmware
; ---------------------------------------------------------------------------
[env:esp32-s3-devkitc-1]
platform = espressif32@6.11.0
board = esp32-s3-devkitc-1
framework = arduino
; src_dir is firmware/src, so the firmware's own sources are <*.cpp> and the
; portable core is one level up.  Both must be compiled into the image.
build_src_filter =
    +<*.cpp>
    ${core_sources.build_src_filter}
monitor_speed = 115200
monitor_filters = time, colorize, esp32_exception_decoder
upload_speed = 921600
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
build_unflags = -std=gnu++11
build_flags =
    ${common_flags.build_flags}
    -std=gnu++17
    -O2
    -DNAV_LOG_LEVEL=2
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
    knolleary/PubSubClient@^2.8.0
test_ignore = *

; ---------------------------------------------------------------------------
; ESP32-S3 firmware with mock/Serial position input forced on
; ---------------------------------------------------------------------------
[env:esp32-s3-devkitc-1-mock]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DNAVIGATION_USE_MOCK_POSITION=1
