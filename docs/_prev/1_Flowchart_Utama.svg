<text x="860" y="40" font-size="12" text-anchor="middle" font-weight="bold" fill="#1a1a1a">
<tspan x="860" dy="0">FLOWCHART NAVIGASI SMART TROLLEY — ALUR UTAMA (TaskNavigation 20 Hz)</tspan>
</text>
<g fill="#FDEDEC" stroke="#C0392B" stroke-width="1.5">
<rect x="40.0" y="70.0" width="360.0" height="150.0" rx="14" ry="14"/>
</g>
<text x="220" y="114" font-size="10" text-anchor="middle"  fill="#1a1a1a">
<tspan x="220" dy="0">EMERGENCY STOP (kapan saja)</tspan>
<tspan x="220" dy="12.5"></tspan>
<tspan x="220" dy="12.5">Dicek di awal tiap siklus update()</tspan>
<tspan x="220" dy="12.5">· motor kiri = kanan = 0 (latched)</tspan>
<tspan x="220" dy="12.5">· semua perintah ditolak</tspan>
<tspan x="220" dy="12.5">· clear_estop → IDLE (butuh &#x27;start&#x27; ulang)</tspan>
</text>
<g fill="#FDEDEC" stroke="#C0392B" stroke-width="1.5">
<rect x="40.0" y="250.0" width="360.0" height="170.0" rx="14" ry="14"/>
</g>
<text x="220" y="298" font-size="10" text-anchor="middle"  fill="#1a1a1a">
<tspan x="220" dy="0">SAFETY INVARIANT</tspan>
<tspan x="220" dy="12.5"></tspan>
<tspan x="220" dy="12.5">Motor ≠ 0 HANYA pada state NAVIGATING.</tspan>
<tspan x="220" dy="12.5">ERROR · POSITION_LOST · IDLE · ARRIVED ·</tspan>
<tspan x="220" dy="12.5">REPLANNING · EMERGENCY_STOP → kiri = kanan = 0</tspan>
<tspan x="220" dy="12.5">Safety gate firmware: nav &amp;&amp; !estop → setBoth</tspan>
<tspan x="220" dy="12.5">selain itu → motors.stop()</tspan>
</text>
<g fill="#EAECEE" stroke="#7F8C8D" stroke-width="1.5">
<rect x="40.0" y="450.0" width="360.0" height="170.0" rx="14" ry="14"/>
</g>
<text x="220" y="491" font-size="10" text-anchor="middle"  fill="#1a1a1a">
<tspan x="220" dy="0">TASK FREERTOS</tspan>
<tspan x="220" dy="12.5"></tspan>
<tspan x="220" dy="12.5">Core 0:</tspan>
<tspan x="220" dy="12.5">· TaskPosition (baca JSON posisi)</tspan>
<tspan x="220" dy="12.5">· TaskCommands (parse perintah)</tspan>
<tspan x="220" dy="12.5">· TaskTelemetry (publish 5 Hz)</tspan>
<tspan x="220" dy="12.5">Core 1:</tspan>
<tspan x="220" dy="12.5">· TaskNavigation (FSM+follower 20 Hz)</tspan>
</text>
