<tspan x="800" dy="13.75">· Baca graph.json + navigation.json (embedded / file)</tspan>
<tspan x="800" dy="13.75">· Validasi config &amp; graph · buat task FreeRTOS</tspan>
<tspan x="800" dy="13.75">· motor kiri = motor kanan = 0 · FSM = BOOT</tspan>
</text>
