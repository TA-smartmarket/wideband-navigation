<text x="830" y="40" font-size="12" text-anchor="middle" font-weight="bold" fill="#1a1a1a">
<tspan x="830" dy="0">DETAIL — VALIDASI POSISI (validateMeasurement) urutan cek termurah → mahal</tspan>
</text>
<g fill="#D5F5E3" stroke="#27AE60" stroke-width="1.5">
<rect x="560.0" y="80.0" width="300.0" height="60.0"/>
</g>
<text x="710" y="102" font-size="12" text-anchor="middle" font-weight="bold" fill="#1a1a1a">
<tspan x="710" dy="0">SAMPLE POSISI</tspan>
<tspan x="710" dy="15.0">MASUK</tspan>
</text>
<g fill="#E8DAEF" stroke="#8E44AD" stroke-width="1.5">
<polygon points="550.0,180.0 910.0,180.0 870.0,270.0 510.0,270.0"/>
</g>
<text x="710" y="211" font-size="11" text-anchor="middle"  fill="#1a1a1a">
<tspan x="710" dy="0">INPUT: PositionMeasurement</tspan>
<tspan x="710" dy="13.75">schema_version · frame_id · trolley_id</tspan>
<tspan x="710" dy="13.75">x_m · y_m · quality · valid · timestamp_ms</tspan>
</text>
<g fill="#FCF3CF" stroke="#B7950B" stroke-width="1.5">
<rect x="540.0" y="320.0" width="340.0" height="80.0"/>
</g>
<text x="710" y="352" font-size="12" text-anchor="middle" font-weight="bold" fill="#1a1a1a">
<tspan x="710" dy="0">schema_version</tspan>
<tspan x="710" dy="15.0">== kSchemaVersion?</tspan>
</text>
<g fill="#FCF3CF" stroke="#B7950B" stroke-width="1.5">
<rect x="540.0" y="450.0" width="340.0" height="80.0"/>
</g>
<text x="710" y="490" font-size="12" text-anchor="middle" font-weight="bold" fill="#1a1a1a">
<tspan x="710" dy="0">frame_id cocok?</tspan>
</text>
<g fill="#FCF3CF" stroke="#B7950B" stroke-width="1.5">
<rect x="540.0" y="580.0" width="340.0" height="80.0"/>
</g>
<text x="710" y="612" font-size="12" text-anchor="middle" font-weight="bold" fill="#1a1a1a">
<tspan x="710" dy="0">trolley_id terisi</tspan>
<tspan x="710" dy="15.0">(bukan kosong)?</tspan>
</text>
<g fill="#FCF3CF" stroke="#B7950B" stroke-width="1.5">
<rect x="540.0" y="710.0" width="340.0" height="80.0"/>
</g>
<text x="710" y="742" font-size="12" text-anchor="middle" font-weight="bold" fill="#1a1a1a">
<tspan x="710" dy="0">x_m &amp; y_m</tspan>
<tspan x="710" dy="15.0">finite (isFinite)?</tspan>
</text>
<g fill="#FCF3CF" stroke="#B7950B" stroke-width="1.5">
<rect x="540.0" y="840.0" width="340.0" height="80.0"/>
</g>
<text x="710" y="880" font-size="12" text-anchor="middle" font-weight="bold" fill="#1a1a1a">
<tspan x="710" dy="0">valid == true?</tspan>
</text>
<g fill="#FCF3CF" stroke="#B7950B" stroke-width="1.5">
<rect x="540.0" y="970.0" width="340.0" height="80.0"/>
</g>
<text x="710" y="1002" font-size="12" text-anchor="middle" font-weight="bold" fill="#1a1a1a">
<tspan x="710" dy="0">quality finite &amp;</tspan>
<tspan x="710" dy="15.0">≥ minimum_quality?</tspan>
</text>
<g fill="#FCF3CF" stroke="#B7950B" stroke-width="1.5">
<rect x="540.0" y="1100.0" width="340.0" height="80.0"/>
</g>
<text x="710" y="1132" font-size="12" text-anchor="middle" font-weight="bold" fill="#1a1a1a">
<tspan x="710" dy="0">dalam batas peta</tspan>
<tspan x="710" dy="15.0">(+ margin)?</tspan>
</text>
<g fill="#FCF3CF" stroke="#B7950B" stroke-width="1.5">
<rect x="540.0" y="1230.0" width="340.0" height="80.0"/>
</g>
<text x="710" y="1262" font-size="12" text-anchor="middle" font-weight="bold" fill="#1a1a1a">
<tspan x="710" dy="0">timestamp ≠ 0 &amp;</tspan>
<tspan x="710" dy="15.0">tidak stale?</tspan>
</text>
<g fill="#D5F5E3" stroke="#27AE60" stroke-width="1.5">
<rect x="560.0" y="1360.0" width="300.0" height="70.0"/>
</g>
<text x="710" y="1388" font-size="12" text-anchor="middle" font-weight="bold" fill="#1a1a1a">
<tspan x="710" dy="0">ACCEPTED</tspan>
<tspan x="710" dy="15.0">accepted = true · status = OK</tspan>
</text>
<g fill="#D5F5E3" stroke="#27AE60" stroke-width="1.5">
<rect x="540.0" y="1470.0" width="340.0" height="70.0"/>
</g>
<text x="710" y="1498" font-size="12" text-anchor="middle" font-weight="bold" fill="#1a1a1a">
<tspan x="710" dy="0">return MeasurementStatus::OK</tspan>
<tspan x="710" dy="15.0">FSM: filter (EMA) → pakai posisi</tspan>
</text>
<g fill="#FADBD8" stroke="#C0392B" stroke-width="1.5">
<rect x="1100.0" y="900.0" width="380.0" height="220.0"/>
</g>
<text x="1290" y="954" font-size="10" text-anchor="middle"  fill="#1a1a1a">
<tspan x="1290" dy="0">TOLAK (tolak paling awal yang gagal)</tspan>
<tspan x="1290" dy="12.5"></tspan>
<tspan x="1290" dy="12.5">→ BAD_SCHEMA_VERSION</tspan>
<tspan x="1290" dy="12.5">→ WRONG_FRAME_ID</tspan>
<tspan x="1290" dy="12.5">→ WRONG_TROLLEY_ID</tspan>
<tspan x="1290" dy="12.5">→ NON_FINITE_COORDINATE</tspan>
<tspan x="1290" dy="12.5">→ INVALID_FLAG</tspan>
<tspan x="1290" dy="12.5">→ LOW_QUALITY</tspan>
<tspan x="1290" dy="12.5">→ OUT_OF_MAP_BOUNDS</tspan>
<tspan x="1290" dy="12.5">→ STALE_TIMESTAMP</tspan>
</text>
<g fill="#FDEDEC" stroke="#C0392B" stroke-width="1.5">
<rect x="1120.0" y="1490.0" width="340.0" height="80.0"/>
</g>
<text x="1290" y="1515" font-size="12" text-anchor="middle" font-weight="bold" fill="#1a1a1a">
<tspan x="1290" dy="0">return status error</tspan>
<tspan x="1290" dy="15.0">FSM: invalid_sample_count++</tspan>
<tspan x="1290" dy="15.0">log dibatasi (1–3 lalu tiap 20)</tspan>
</text>
</svg>