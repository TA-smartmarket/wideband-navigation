<text x="820" y="40" font-size="12" text-anchor="middle" font-weight="bold" fill="#1a1a1a">
<tspan x="820" dy="0">DETAIL — SUBROUTINE planRoute() + ALGORITMA DIJKSTRA</tspan>
</text>
<g fill="#D6EAF8" stroke="#2471A3" stroke-width="1.5">
<rect x="600.0" y="80.0" width="360.0" height="60.0"/>
</g>
<text x="780" y="110" font-size="12" text-anchor="middle" font-weight="bold" fill="#1a1a1a">
<tspan x="780" dy="0">MASUK: planRoute(is_replan)</tspan>
</text>
<g fill="#FCF3CF" stroke="#B7950B" stroke-width="1.5">
<rect x="620.0" y="190.0" width="320.0" height="80.0"/>
</g>
<text x="780" y="230" font-size="12" text-anchor="middle" font-weight="bold" fill="#1a1a1a">
<tspan x="780" dy="0">graph tersedia?</tspan>
</text>
<g fill="#FCF3CF" stroke="#B7950B" stroke-width="1.5">
<rect x="620.0" y="320.0" width="320.0" height="80.0"/>
</g>
<text x="780" y="360" font-size="12" text-anchor="middle" font-weight="bold" fill="#1a1a1a">
<tspan x="780" dy="0">destination_node ≥ 0?</tspan>
</text>
<g fill="#FCF3CF" stroke="#B7950B" stroke-width="1.5">
<rect x="620.0" y="450.0" width="320.0" height="80.0"/>
</g>
<text x="780" y="482" font-size="12" text-anchor="middle" font-weight="bold" fill="#1a1a1a">
<tspan x="780" dy="0">has_position (ada</tspan>
<tspan x="780" dy="15.0">posisi valid)?</tspan>
</text>
<g fill="#D6EAF8" stroke="#2471A3" stroke-width="1.5">
<rect x="550.0" y="580.0" width="460.0" height="90.0"/>
</g>
<text x="780" y="611" font-size="11" text-anchor="middle"  fill="#1a1a1a">
<tspan x="780" dy="0">snap = findNearestNode(filtered_position, snap_limit)</tspan>
<tspan x="780" dy="13.75">· plan awal → max_graph_snap_distance_m</tspan>
<tspan x="780" dy="13.75">· replan → replan_max_graph_snap_distance_m (lebih lebar)</tspan>
</text>
<g fill="#FCF3CF" stroke="#B7950B" stroke-width="1.5">
<rect x="620.0" y="720.0" width="320.0" height="80.0"/>
</g>
<text x="780" y="760" font-size="12" text-anchor="middle" font-weight="bold" fill="#1a1a1a">
<tspan x="780" dy="0">snap.found?</tspan>
</text>
<g fill="#FDEBD0" stroke="#CA6F1E" stroke-width="1.5">
<rect x="1030.0" y="720.0" width="360.0" height="110.0" rx="14" ry="14"/>
</g>
<text x="1210" y="754" font-size="11" text-anchor="middle"  fill="#1a1a1a">
<tspan x="1210" dy="0">Kasus replan: node terdekat bisa sudah</tspan>
<tspan x="1210" dy="13.75">terlewati (trolley berbalik-mundur).</tspan>
<tspan x="1210" dy="13.75">Jika node ada di belakang rute,</tspan>
<tspan x="1210" dy="13.75">santap ulang ke node TERDEKAT DI DEPAN.</tspan>
</text>
<g fill="#D6EAF8" stroke="#2471A3" stroke-width="1.5">
<rect x="560.0" y="850.0" width="440.0" height="100.0" rx="6"/><line x1="570.0" y1="850.0" x2="570.0" y2="950.0" stroke="inherit"/><line x1="990.0" y1="850.0" x2="990.0" y2="950.0" stroke="inherit"/>
</g>
<text x="780" y="886" font-size="11" text-anchor="middle" font-weight="bold" fill="#1a1a1a">
<tspan x="780" dy="0">path = dijkstra(graph, snap.node_id, destination)</tspan>
<tspan x="780" dy="13.75">min-heap · relax semua edge · mundur rekonstruksi</tspan>
<tspan x="780" dy="13.75">ukur plan_time_us (nanodeteksi)</tspan>
</text>
<g fill="#FCF3CF" stroke="#B7950B" stroke-width="1.5">
<rect x="620.0" y="1000.0" width="320.0" height="80.0"/>
</g>
<text x="780" y="1040" font-size="12" text-anchor="middle" font-weight="bold" fill="#1a1a1a">
<tspan x="780" dy="0">path.success?</tspan>
</text>
<g fill="#D6EAF8" stroke="#2471A3" stroke-width="1.5">
<rect x="550.0" y="1130.0" width="460.0" height="80.0"/>
</g>
<text x="780" y="1163" font-size="11" text-anchor="middle"  fill="#1a1a1a">
<tspan x="780" dy="0">pathToWaypoints() → Waypoint[] (kMaxRouteNodes)</tspan>
<tspan x="780" dy="13.75">skip start node jika trolley sudah di atasnya</tspan>
</text>
<g fill="#FCF3CF" stroke="#B7950B" stroke-width="1.5">
<rect x="620.0" y="1260.0" width="320.0" height="80.0"/>
</g>
<text x="780" y="1300" font-size="12" text-anchor="middle" font-weight="bold" fill="#1a1a1a">
<tspan x="780" dy="0">jumlah waypoint &gt; 0?</tspan>
</text>
<g fill="#D6EAF8" stroke="#2471A3" stroke-width="1.5">
<rect x="540.0" y="1390.0" width="480.0" height="80.0"/>
</g>
<text x="780" y="1423" font-size="11" text-anchor="middle"  fill="#1a1a1a">
<tspan x="780" dy="0">waypoints_.loadRoute() · snapToNearestWaypoint() · setEntryPoint()</tspan>
<tspan x="780" dy="13.75">heading awal TIDAK di-seed (UWB tanpa yaw absolut)</tspan>
</text>
<g fill="#D6EAF8" stroke="#2471A3" stroke-width="1.5">
<rect x="530.0" y="1520.0" width="500.0" height="80.0"/>
</g>
<text x="780" y="1553" font-size="11" text-anchor="middle"  fill="#1a1a1a">
<tspan x="780" dy="0">telemetry: route[], route_length, start_node, planned_distance_m,</tspan>
<tspan x="780" dy="13.75">remaining_distance_m · replan → replan_count++ · deviation_.reset()</tspan>
</text>
<g fill="#AED6F1" stroke="#1F618D" stroke-width="1.5">
<rect x="600.0" y="1650.0" width="360.0" height="70.0"/>
</g>
<text x="780" y="1678" font-size="12" text-anchor="middle" font-weight="bold" fill="#1a1a1a">
<tspan x="780" dy="0">SELESAI planRoute</tspan>
<tspan x="780" dy="15.0">transitionTo(NAVIGATING)</tspan>
</text>
<g fill="#FADBD8" stroke="#C0392B" stroke-width="1.5">
<rect x="1080.0" y="380.0" width="400.0" height="240.0"/>
</g>
<text x="1280" y="450" font-size="10" text-anchor="middle"  fill="#1a1a1a">
<tspan x="1280" dy="0">GAGAL / ERROR</tspan>
<tspan x="1280" dy="12.5">· graph null → GRAPH_INVALID</tspan>
<tspan x="1280" dy="12.5">· destinasi &lt; 0 → INVALID_DESTINATION</tspan>
<tspan x="1280" dy="12.5">· tanpa posisi → INVALID_POSITION</tspan>
<tspan x="1280" dy="12.5">· snap tidak ketemu → START_NODE_NOT_FOUND</tspan>
<tspan x="1280" dy="12.5">· tidak ada rute → ROUTE_NOT_FOUND</tspan>
<tspan x="1280" dy="12.5"></tspan>
<tspan x="1280" dy="12.5">setError() + zeroMotion() +</tspan>
<tspan x="1280" dy="12.5">transitionTo(ERROR)</tspan>
</text>
<g fill="none" stroke="none" stroke-width="1.5">
<rect x="90.0" y="80.0" width="300.0" height="30.0"/>
</g>
<text x="240" y="95" font-size="12" text-anchor="middle" font-weight="bold" fill="#1a1a1a">
<tspan x="240" dy="0">ISI DIJKSTRA (ringkas)</tspan>
</text>
<g fill="#EBF5FB" stroke="#2E86C1" stroke-width="1.5">
<rect x="90.0" y="120.0" width="340.0" height="70.0"/>
</g>
<text x="260" y="141" font-size="11" text-anchor="middle"  fill="#1a1a1a">
<tspan x="260" dy="0">init dist[] = ∞, dist[start]=0</tspan>
<tspan x="260" dy="13.75">previous[] = -1, settled[] = false</tspan>
<tspan x="260" dy="13.75">min-heap push(0, start)</tspan>
</text>
<g fill="#EBF5FB" stroke="#2E86C1" stroke-width="1.5">
<rect x="90.0" y="230.0" width="340.0" height="60.0"/>
</g>
<text x="260" y="252" font-size="12" text-anchor="middle"  fill="#1a1a1a">
<tspan x="260" dy="0">selama heap tidak kosong:</tspan>
<tspan x="260" dy="15.0">pop node dg jarak terkecil</tspan>
</text>
<g fill="#EBF5FB" stroke="#2E86C1" stroke-width="1.5">
<rect x="90.0" y="330.0" width="340.0" height="70.0"/>
</g>
<text x="260" y="351" font-size="11" text-anchor="middle"  fill="#1a1a1a">
<tspan x="260" dy="0">untuk tiap tepi (tetangga):</tspan>
<tspan x="260" dy="13.75">relax → dist[neighbor] = min(...)</tspan>
<tspan x="260" dy="13.75">push bila lebih pendek</tspan>
</text>
<g fill="#FCF3CF" stroke="#B7950B" stroke-width="1.5">
<rect x="100.0" y="440.0" width="320.0" height="80.0"/>
</g>
<text x="260" y="472" font-size="12" text-anchor="middle" font-weight="bold" fill="#1a1a1a">
<tspan x="260" dy="0">tujuan settled?</tspan>
<tspan x="260" dy="15.0">(atau heap habis)</tspan>
</text>
<g fill="#EBF5FB" stroke="#2E86C1" stroke-width="1.5">
<rect x="90.0" y="560.0" width="340.0" height="70.0"/>
</g>
<text x="260" y="580" font-size="12" text-anchor="middle"  fill="#1a1a1a">
<tspan x="260" dy="0">rekonstruksi jalur</tspan>
<tspan x="260" dy="15.0">mundur dari tujuan →</tspan>
<tspan x="260" dy="15.0">reverse → node_ids[]</tspan>
</text>
<g fill="#D5F5E3" stroke="#27AE60" stroke-width="1.5">
<rect x="110.0" y="670.0" width="300.0" height="70.0"/>
</g>
<text x="260" y="698" font-size="12" text-anchor="middle" font-weight="bold" fill="#1a1a1a">
<tspan x="260" dy="0">hasil: success, jarak total,</tspan>
<tspan x="260" dy="15.0">jumlah node (expanded_nodes)</tspan>
</text>
</svg>